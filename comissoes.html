<script>
/* ─── HELPERS ──────────────────────────────────────── */
function revealAll() {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }});
  }, { threshold: .12 });
  document.querySelectorAll('.reveal, .reveal-from-right').forEach(el => io.observe(el));
}

/* ─── COMISSÕES ────────────────────────────────────── */
/* resolverPessoa, iniciaisDaPessoa e rotuloCoordenacao vivem em
   assets/pessoas.js, compartilhadas com as demais páginas. */
function renderCommittee() {
  const el = document.getElementById('comissoes-grid');
  if (!el) return;
  el.innerHTML = COMMITTEE.map((c,i) => {
    const todos=c.membros.map(resolverPessoa).filter(Boolean);
    const coords=todos.filter(m=>m.coordenacao), members=todos.filter(m=>!m.coordenacao);
    function memberCard(m) {
      const initials=iniciaisDaPessoa(m.nome);
      const photoHTML=m.foto?`<img src="${m.foto}" alt="${m.nome}" loading="lazy">`:`<span class="comissao-member-initials">${initials}</span>`;
      const links=[m.lattes?`<a class="member-link member-link--lattes" href="${m.lattes}" target="_blank" rel="noopener">Lattes</a>`:'',m.website?`<a class="member-link member-link--website" href="${m.website}" target="_blank" rel="noopener">↗ Site</a>`:''].filter(Boolean).join('');
      const rotulo=rotuloCoordenacao(m);
      return `<div class="comissao-member-card${m.coordenacao?' is-coord':''}"><div class="comissao-member-photo">${photoHTML}</div><div class="comissao-member-info"><div class="name">${m.nome}</div>${m.coordenacao?`<span class="coord-badge">${rotulo}</span>`:''}<div class="affil">${m.instituicao}</div>${links?`<span class="member-links">${links}</span>`:''}</div></div>`;
    }
    return `<div class="comissao-card reveal${i>0?' reveal-delay-1':''}"><div class="comissao-card-header"><span class="card-icon">${c.icone}</span><h3>${c.titulo}</h3></div>${coords.length?`<div class="comissao-member-grid comissao-member-grid--coord">${coords.map(memberCard).join('')}</div><div class="comissao-coord-divider"></div>`:''}<div class="comissao-member-grid">${members.map(memberCard).join('')}</div></div>`;
  }).join('');
}


/* ─── BOOT ─────────────────────────────────────────── */
renderCommittee();
revealAll();
</script>
