name: Atualizar programação

# Lê as abas publicadas da planilha, valida e grava os dados em data/.
# São quatro arquivos: a programação, além do cadastro de pessoas, comissões e
# convidados. Roda de hora em hora e também sob demanda, pelo botão "Run workflow".

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_programacao.py'
      - 'scripts/build_cadastro.mjs'
      - 'scripts/fontes.json'
      - '.github/workflows/programacao.yml'

permissions:
  contents: write

concurrency:
  group: programacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar o JSON a partir da planilha
        run: python3 scripts/build_programacao.py --csv scripts/fontes.json -o data/programacao.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar o cadastro a partir da planilha
        run: node scripts/build_cadastro.mjs --fontes scripts/fontes.json

      - name: Verificar fontes únicas
        run: node scripts/checar_fontes.mjs

      - name: Publicar quando houver mudança
        run: |
          ARQUIVOS="data/programacao.json data/pessoas.js data/committee.js data/speakers.js"
          if git diff --quiet -- $ARQUIVOS; then
            echo "Planilha sem alterações."
            exit 0
          fi
          git config user.name  "programacao-bot"
          git config user.email "actions@github.com"
          git add $ARQUIVOS
          git commit -m "Dados atualizados a partir da planilha"
          for tentativa in 1 2 3; do
            if git push; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi
            echo "Push recusado, reaplicando sobre o remoto atualizado."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "Três tentativas recusadas."
          exit 1
